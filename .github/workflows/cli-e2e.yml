name: CLI journey E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli-journey:
    name: CLI journey (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Build real terminal binary
        run: cargo build --bin tks --bin tks-attest
      - name: Five-hero cross-process CLI journeys
        run: python3 tests/cli_journey_e2e.py target/debug/tks
      - name: Trusted revision checkpoint CLI E2E
        run: python3 tests/checkpoint_cli_e2e.py target/debug/tks target/debug/tks-attest
