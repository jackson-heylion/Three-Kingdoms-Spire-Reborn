          assert all(a['seq'] < b['seq'] for a, b in zip(game['battle']['events'],game['battle']['events'][1:]))
          assert prefs['theme'] == 'light'
          assert profile['version'] == 1 and profile['started'] == 1
          assert profile['best_floor'] >= 1
          assert '读取进度成功' in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-second.log').read_text()
          assert '结算' in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-second.log').read_text()
          assert '下一游标' in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-second.log').read_text()
          assert '游标超过当前战斗最新序号' in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-second.log').read_text()
          assert '抽牌堆' in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-second.log').read_text()
          assert '亲兵：行动' in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-second.log').read_text()
          assert game['telemetry']['totals']['battles_started']==1
          print('CLI mid-combat save/theme/resume smoke test passed')
          PY

      - name: CLI atomic backup and corrupt-primary restore (both platforms)
        shell: bash
        run: |
          DIR="$RUNNER_TEMP/tks-durable-restore"
          printf 'new guanyu 55555\nchoose 1\nquit\n' | target/release/tks --plain --save-dir "$DIR" > "$RUNNER_TEMP/durable-before.log"
          python3 - <<'PY'
          import json, os, pathlib
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "tks-durable-restore"
          primary = json.loads((directory / "save.json").read_text())
          backup = json.loads((directory / "save.bak").read_text())
          assert primary["revision"] == 1 and backup["revision"] == 1  # quit saves once more
          assert primary["seed"] == backup["seed"] == 55555
          (directory / "save.json").write_text("{damaged")
          PY
          printf 'verify\nquit\n' | target/release/tks --plain --save-dir "$DIR" > "$RUNNER_TEMP/durable-after.log"
          python3 - <<'PY'
          import json, os, pathlib
          directory = pathlib.Path(os.environ["RUNNER_TEMP"]) / "tks-durable-restore"
          primary = json.loads((directory / "save.json").read_text())
          backup = json.loads((directory / "save.bak").read_text())
          assert primary["revision"] == 1 and backup["revision"] == 1
          assert (directory / "save.corrupt").read_text() == "{damaged"
          assert primary["seed"] == backup["seed"] == 55555
          assert not list(directory.glob("*.tmp.*")), "staging files must not leak"
          output = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "durable-after.log").read_text()
          assert "已从上一次有效" in output and "回放校验" in output
          print("CLI validated backup restored atomically on this runner")
          PY

      - name: CLI failed action is not committed until save succeeds (both platforms)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          base = pathlib.Path(os.environ['RUNNER_TEMP'])
          directory = base / 'tks-action-durable'
          binary = str(pathlib.Path.cwd() / 'target' / 'release' / 'tks')
          cmd = [binary, '--plain', '--save-dir', str(directory)]
          setup = subprocess.run(cmd, input='new guanyu 96103\\nquit\\n'.replace('\\n','\n'),
                                 capture_output=True, text=True, timeout=20)
          assert setup.returncode == 0, (setup.stdout, setup.stderr)
          path = directory / 'save.json'
          baseline = path.read_text()
          assert json.loads(baseline)['revision'] == 0
          backup = directory / 'save.bak'
          backup.unlink()
          backup.mkdir()
          failed = subprocess.run(cmd, input='choose 1\\nhistory\\nstatus\\n'.replace('\\n','\n'),
                                  capture_output=True, text=True, timeout=20)
          assert failed.returncode == 2, (failed.returncode, failed.stdout, failed.stderr)
          assert '错误：' in failed.stdout, failed.stdout
          assert '累计0次成功操作' in failed.stdout, failed.stdout
          assert path.read_text() == baseline, 'failed action wrote or altered primary'
          backup.rmdir()
          retried = subprocess.run(cmd, input='choose 1\\nquit\\n'.replace('\\n','\n'),
                                   capture_output=True, text=True, timeout=20)
          assert retried.returncode == 0, (retried.stdout, retried.stderr)
          game = json.loads(path.read_text())
          assert game['revision'] == 1, game['revision']
          assert len(game['action_history']) == 1
          assert game['stage'] == 'combat'
          print('A failed command leaves RAM and disk unchanged; retry commits once')
          PY

      - name: CLI failed-quit write guard and invalid JSON-state recovery (both platforms)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          base = pathlib.Path(os.environ['RUNNER_TEMP'])
          directory = base / 'tks-failed-quit'
          binary = str(pathlib.Path.cwd() / 'target' / 'release' / 'tks')
          cmd = [binary, '--plain', '--save-dir', str(directory)]
          initial = subprocess.run(cmd, input='new guanyu 96015\nquit\n',
                                   capture_output=True, text=True, timeout=20)
          assert initial.returncode == 0, (initial.stdout, initial.stderr)
          path = directory / 'save.json'
          baseline = path.read_text()
          backup = directory / 'save.bak'
          assert backup.is_file()
          backup.unlink()
          backup.mkdir()
          failure = subprocess.run(cmd, input='quit\nstatus\n',
                                   capture_output=True, text=True, timeout=20)
          assert failure.returncode == 2, (failure.returncode, failure.stdout, failure.stderr)
          assert '退出前保存失败' in failure.stdout
          assert '体力' in failure.stdout, 'a rejected quit must keep handling commands'
          assert '输入结束时自动存档失败' in failure.stderr
          assert path.read_text() == baseline, 'save failure must preserve the last good primary'
          backup.rmdir()
          retry = subprocess.run(cmd, input='quit\n',
                                 capture_output=True, text=True, timeout=20)
          assert retry.returncode == 0, (retry.stdout, retry.stderr)
          assert json.loads(path.read_text())['seed'] == 96015
          invalid = json.loads(path.read_text())
          invalid['gold'] = -1
          path.write_text(json.dumps(invalid, ensure_ascii=False))
          repaired = subprocess.run(cmd, input='quit\n',
                                    capture_output=True, text=True, timeout=20)
