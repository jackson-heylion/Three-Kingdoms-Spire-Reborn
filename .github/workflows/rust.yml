name: Rust checks
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Export and validate paired Boss duel evidence
        shell: bash
        run: |
          TKS_BOSS_DUEL_REPORT="$RUNNER_TEMP/tks-boss-duels.json" cargo test --test boss_build_duels -- --nocapture
          python3 - <<'PY'
          import collections, json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-boss-duels.json'
          report = json.loads(path.read_text())
          assert report['schema_version'] == 1
          assert report['fixture'] == 'single_floor_one_boss_120hp'
          assert report['policy'] == 'first_playable'
          cells = report['cells']
          assert report['pairs'] == len(cells) == 120
          counts = collections.Counter((c['plan'], c['boss'], c['ascension']) for c in cells)
          assert len(counts) == 60 and set(counts.values()) == {2}
          assert len({c['plan'] for c in cells}) == 15
          assert {c['boss'] for c in cells} == {'simayi', 'zuoci'}
          assert {c['ascension'] for c in cells} == {0, 10}
          assert len({(c['plan'], c['boss'], c['ascension'], c['seed']) for c in cells}) == 120
          for c in cells:
              for side in ('baseline', 'curated'):
                  d = c[side]
                  assert type(d['won']) is bool and type(d['phase_seen']) is bool
                  assert all(type(d[k]) is int and d[k] >= 0 for k in
                             ('hp_damage', 'techniques', 'actions'))
                  assert d['actions'] > 0
          assert report['baseline_wins'] == sum(c['baseline']['won'] for c in cells)
          assert report['curated_wins'] == sum(c['curated']['won'] for c in cells)
          assert report['gross_hp_damage'] == sum(c[s]['hp_damage'] for c in cells for s in ('baseline','curated'))
          assert report['phase_observations'] == sum(c[s]['phase_seen'] for c in cells for s in ('baseline','curated'))
          assert report['technique_events'] == sum(c[s]['techniques'] for c in cells for s in ('baseline','curated'))
          assert report['total_actions'] == sum(c[s]['actions'] for c in cells for s in ('baseline','curated'))
          print('120 paired Boss duels: structured report and all aggregates verified')
          PY
      - name: Independent Sun/Zuoci seed sweep and paired diagnostics
        shell: bash
        run: |
          TKS_SUN_ZUOCI_REPORT="$RUNNER_TEMP/tks-sun-zuoci.json" cargo test --test boss_build_duels sun_zuoci_independent_seed_pairs -- --ignored --nocapture
          python3 - <<'PY'
          import collections, json, math, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-sun-zuoci.json'
          report = json.loads(path.read_text())
          plans = {'sun_discard', 'sun_combo', 'sun_poison'}
          assert report['schema_version'] == 1
          assert report['fixture'] == 'single_floor_one_boss_120hp'
          assert report['policy'] == 'first_playable'
          assert report['focus'] == 'sun_zuoci_independent_seeds'
          assert report['independent_fixtures'] == 32 and report['pairs'] == 96
          cells = report['cells']
          assert len(cells) == 96
          identities = [(c['plan'], c['ascension'], c['seed']) for c in cells]
          assert len(set(identities)) == 96, 'duplicate plan/ascension/seed'
          groups = collections.defaultdict(list)
          for c in cells:
              assert c['plan'] in plans and c['hero'] == 'SunShangxiang' and c['boss'] == 'zuoci'
              asc, seed = c['ascension'], c['seed']
              assert type(asc) is int and asc in (0, 10)
              assert type(seed) is int and seed in {26_300_000 + asc * 100 + i for i in range(16)}
              for side in ('baseline', 'curated'):
                  d = c[side]
                  assert type(d) is dict
                  assert type(d['won']) is bool and type(d['phase_seen']) is bool
                  assert all(type(d[k]) is int and d[k] >= 0 for k in
                             ('hp_damage', 'techniques', 'actions'))
                  assert d['actions'] > 0
              groups[(asc, seed)].append(c)
          assert len(groups) == 32
          for group in groups.values():
              assert {c['plan'] for c in group} == plans
              assert all(c['baseline'] == group[0]['baseline'] for c in group), 'baseline drift'
          assert report['baseline_wins'] == sum(c['baseline']['won'] for c in cells)
          assert report['curated_wins'] == sum(c['curated']['won'] for c in cells)
          def exact_p(b, c):
              n = b + c
              return min(1.0, 2 * sum(math.comb(n, i) for i in range(min(b, c) + 1)) / 2**n) if n else None
          for plan in sorted(plans):
              for asc in (0, 10):
                  rows = [c for c in cells if c['plan'] == plan and c['ascension'] == asc]
                  assert len(rows) == 16
                  base = sum(c['baseline']['won'] for c in rows)
                  built = sum(c['curated']['won'] for c in rows)
                  b_only = sum(c['baseline']['won'] and not c['curated']['won'] for c in rows)
                  c_only = sum(c['curated']['won'] and not c['baseline']['won'] for c in rows)
                  base_damage = sum(c['baseline']['hp_damage'] for c in rows)
                  built_damage = sum(c['curated']['hp_damage'] for c in rows)
                  print(f'SUN_ZUOCI plan={plan} asc={asc} n=16 baseline={base} curated={built} '
                        f'baseline_only={b_only} curated_only={c_only} exact_p={exact_p(b_only,c_only)} '
                        f'damage_baseline={base_damage} damage_curated={built_damage}')
          print('32 unique seeds, 96 paired plan outcomes, baseline equivalence and counts verified')
          PY

      - name: Sun discard policy sensitivity on identical Zuoci seeds
        shell: bash
        run: |
          TKS_DISCARD_POLICY_REPORT="$RUNNER_TEMP/tks-discard-policy.json" cargo test --test boss_build_duels sun_zuoci_discard_policy_sensitivity -- --ignored --nocapture
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-discard-policy.json'
          report = json.loads(path.read_text())
          assert report['schema_version'] == 1
          assert report['fixture'] == 'single_floor_one_boss_120hp'
          assert report['focus'] == 'sun_discard_zuoci_policy_sensitivity'
          assert report['paired_conditions'] == 32
          cells = report['cells']
          assert len(cells) == 32
          assert {(c['ascension'], c['seed']) for c in cells} == {
              (asc, 26_300_000 + asc * 100 + i) for asc in (0, 10) for i in range(16)
          }
          assert all(c['plan'] == 'sun_discard' for c in cells)
          for c in cells:
              for policy in ('first_playable', 'discard_aware'):
                  side = c[policy]
                  outcome = side['outcome']
                  assert type(outcome['won']) is bool and type(outcome['phase_seen']) is bool
                  assert all(type(outcome[k]) is int and outcome[k] >= 0
                             for k in ('hp_damage', 'techniques', 'actions'))
                  assert outcome['actions'] > 0
                  assert all(type(side[k]) is int and side[k] >= 0
                             for k in ('discard_actions', 'arrows_triggers'))
              assert c['first_playable']['discard_actions'] == 0
          aware_discards = sum(c['discard_aware']['discard_actions'] for c in cells)
          assert aware_discards > 0, 'new policy never exercised discard mechanic'
          for policy in ('first_playable', 'discard_aware'):
              wins = sum(c[policy]['outcome']['won'] for c in cells)
              discards = sum(c[policy]['discard_actions'] for c in cells)
              arrows = sum(c[policy]['arrows_triggers'] for c in cells)
              damage = sum(c[policy]['outcome']['hp_damage'] for c in cells)
              print(f'SUN_DISCARD_POLICY policy={policy} wins={wins}/32 '
                    f'discards={discards} arrows_triggers={arrows} gross_hp_damage={damage}')
          print('32 same-deck same-seed policy pairs validated; no win-rate threshold imposed')
          PY

      - name: Build evidence analyzer regressions
        run: python3 -m unittest discover -s tests -p 'test_analyze_*.py' -v
      - name: Gherkin BDD acceptance
        run: cargo test --test bdd -- --nocapture
      - name: Release build
        run: cargo build --release

      - name: Unranked reaction CLI event-source persistence (both platforms)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'tks-dynamic-reactions'
          binary=str(pathlib.Path.cwd()/'target'/'release'/'tks')
          run=subprocess.run([binary,'--plain','--save-dir',str(base)],
                             input='custom zhuge 925144 0\nchoose 1\nreact ward weak hero reduce 1\nverify\nverify-events\nquit\n',
                             capture_output=True,text=True,timeout=30)
          assert run.returncode==0, (run.stdout,run.stderr)
          assert '已登记动态监听器 ward' in run.stdout, run.stdout
          assert '错误：' not in run.stdout, run.stdout
          saved=json.loads((base/'save.json').read_text())
          rules=saved['battle']['reactions']['listeners']
          assert len(rules)==1 and rules[0]['id']=='ward', rules
          assert len(saved['action_history'])==2, saved['action_history']
          assert saved['event_history'], 'missing complete battle source'
          resumed=subprocess.run([binary,'--plain','--save-dir',str(base)],
                                 input='verify\nverify-events\nquit\n',
                                 capture_output=True,text=True,timeout=30)
          assert resumed.returncode==0 and '错误：' not in resumed.stdout, (resumed.stdout,resumed.stderr)
          print('Custom listener save/replay and cross-process verification passed')
          PY

      - name: Custom listener registration removal and cross-process replay
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          base=pathlib.Path(os.environ['RUNNER_TEMP'])/'tks-reaction-unregister'
          binary=str(pathlib.Path.cwd()/'target'/'release'/'tks')
          cmd=[binary,'--plain','--save-dir',str(base)]
          commands='custom zhuge 925144 0\nchoose 1\nreact ward weak hero cancel\nreact-remove ward\nreact-remove ward\nverify\nverify-events\nquit\n'
          first=subprocess.run(cmd,input=commands,capture_output=True,text=True,timeout=40)
          assert first.returncode==0,(first.stdout,first.stderr)
          assert '已登记动态监听器 ward' in first.stdout,first.stdout
          assert '已注销动态监听器 ward' in first.stdout,first.stdout
          assert 'reaction not found' in first.stdout,first.stdout
          saved=json.loads((base/'save.json').read_text())
          assert not saved['battle'].get('reactions',{}).get('listeners')
          assert len(saved['action_history'])==3,saved['action_history']
          second=subprocess.run(cmd,input='verify\nverify-events\nquit\n',
                                capture_output=True,text=True,timeout=40)
          assert second.returncode==0 and '错误：' not in second.stdout,(second.stdout,second.stderr)
          print('Listener lifecycle and full action/event source replay passed')
          PY

      - name: CLI replacement campaigns survive blocked writes (both platforms)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          base = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-new-run-failure'
          binary = str(pathlib.Path.cwd() / 'target' / 'release' / 'tks')
          cmd = [binary, '--plain', '--save-dir', str(base)]
          started = subprocess.run(cmd, input='new guanyu 96121\nquit\n',
                                   capture_output=True, text=True, timeout=20)
          assert started.returncode == 0, (started.stdout, started.stderr)
          primary = base / 'save.json'
          original = primary.read_text()
          backup = base / 'save.bak'
          assert backup.is_file()
          backup.unlink()
          backup.mkdir()
          for command in ('new cao 96122 0', 'custom sun 96123 5', 'daily 2026-10-19'):
              refused = subprocess.run(cmd, input=command + '\nstatus\n',
                                       capture_output=True, text=True, timeout=20)
              assert refused.returncode == 2, (refused.stdout, refused.stderr)
              assert '新战役未能保存' in refused.stdout, refused.stdout
              assert '体力' in refused.stdout, 'old campaign no longer interactive'
              assert primary.read_text() == original, 'refused new run damaged prior save'
          backup.rmdir()
          resumed = subprocess.run(cmd, input='custom sun 96123 5\nquit\n',
                                   capture_output=True, text=True, timeout=20)
          assert resumed.returncode == 0, (resumed.stdout, resumed.stderr)
          current = json.loads(primary.read_text())
          assert current['seed'] == 96123 and current['ascension'] == 5, current
          assert json.loads(backup.read_text())['seed'] == 96123, 'exit backup should capture new run'
          assert '以 孙尚香 开始' in resumed.stdout
          print('new/custom/daily failure preserved prior snapshot; repaired storage commits once')
          PY

      - name: CLI market card purchase and resume (both platforms)
        shell: bash
        run: |
          SAVEDIR="$RUNNER_TEMP/tks-market-purchase"
          printf 'new guanyu 93404\nquit\n' | cargo run --quiet -- --plain --save-dir "$SAVEDIR" > "$RUNNER_TEMP/tks-market-setup.log"
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-market-purchase' / 'save.json'
          game = json.loads(path.read_text())
          game['stage'] = 'market'
          game['last_node'] = 'market'
          game['gold'] = 90
          game['market'] = [{'id':'huogong','upgraded':False,'enchantment':None,
                             'quest_progress':0,'temporary':False}]
          path.write_text(json.dumps(game, ensure_ascii=False))
          PY
          printf 'choose 1\ndeck\nquit\n' | cargo run --quiet -- --plain --save-dir "$SAVEDIR" > "$RUNNER_TEMP/tks-market-bought.log"
          printf 'deck\nchoose 1\nquit\n' | cargo run --quiet -- --plain --save-dir "$SAVEDIR" > "$RUNNER_TEMP/tks-market-resume.log"
          python3 - <<'PY'
          import json, os, pathlib
          base = pathlib.Path(os.environ['RUNNER_TEMP'])
          game = json.loads((base / 'tks-market-purchase' / 'save.json').read_text())
          assert game['gold'] == 45 and game['market'] == [], game
          assert sum(card['id'] == 'huogong' for card in game['deck']) == 1
          assert game['revision'] == 1, game['revision']
          first = (base / 'tks-market-bought.log').read_text()
          second = (base / 'tks-market-resume.log').read_text()
          assert '已加入永久牌组' in first and '火攻' in first
          assert '火攻' in second and '该商品已售出' in second
          print('CLI military market charges once, grants card and preserves it after restart')
          PY

      - name: CLI single-writer process exclusion and recovery (both platforms)
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, time
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-single-writer'
          binary = str(pathlib.Path.cwd() / 'target' / 'release' / 'tks')
          args = [binary, '--plain', '--save-dir', str(directory)]
          first = subprocess.Popen(args, stdin=subprocess.PIPE,
                                   stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, text=True)
          try:
              lock_file = directory / '.tks.lock'
              for _ in range(100):
                  if first.poll() is not None:
                      raise AssertionError('first TKS process exited unexpectedly')
                  if lock_file.exists():
                      time.sleep(0.15)
                      break
                  time.sleep(0.05)
              else:
                  raise AssertionError('first TKS never created lock file')
              second = subprocess.run(args, input='new guanyu 917\nquit\n',
                                      capture_output=True, text=True, timeout=15)
              assert second.returncode == 2, (second.returncode, second.stderr)
              assert '另一个 TKS 实例占用' in second.stderr, second.stderr
              assert not (directory / 'save.json').exists(), 'blocked writer wrote a save'
              first.stdin.write('new guanyu 917\nquit\n')
              first.stdin.flush()
              first.stdin.close()
              assert first.wait(timeout=20) == 0, first.stderr.read()
              saved = json.loads((directory / 'save.json').read_text())
              assert saved['seed'] == 917
              third = subprocess.run(args, input='status\nquit\n',
                                     capture_output=True, text=True, timeout=15)
              assert third.returncode == 0, third.stderr
              assert '读取进度成功' in third.stdout
              assert lock_file.exists(), 'lock file intentionally remains for inode safety'
              print('Concurrent process rejected, first saves, subsequent process resumes')
          finally:
              if first.poll() is None:
                  first.kill()
                  first.wait(timeout=10)
          PY

      - name: Real controlling TTY keyboard and persistence smoke (both platforms)
        run: python3 tests/tui_pty_smoke.py target/release/tks

      - name: CLI save and resume smoke test
        shell: bash
        run: |
          SAVE_DIR="$RUNNER_TEMP/tks-smoke"
          printf 'new guanyu 777\nchoose 1\nend\nquit\n' | cargo run --quiet -- --plain --save-dir "$SAVE_DIR" > "$RUNNER_TEMP/tks-first.log"
          printf 'status\npowers\nevents\nevents 0 2\nevents 999999\nmetrics\npiles\ntheme light\nquit\n' | cargo run --quiet -- --plain --save-dir "$SAVE_DIR" > "$RUNNER_TEMP/tks-second.log"
          python3 - <<'PY'
          import json, os, pathlib
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-smoke'
          game = json.loads((directory / 'save.json').read_text())
          prefs = json.loads((directory / 'settings.json').read_text())
          profile = json.loads((directory / 'chronicle.json').read_text())
          assert game['version'] == 2 and game['revision'] == 2
          assert game['stage'] == 'combat' and game['floor'] == 1
          assert len(game['battle']['hand']) > 0 and game['rng_state']
