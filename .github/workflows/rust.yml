name: Rust checks
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Gherkin BDD acceptance
        run: cargo test --test bdd -- --nocapture
      - name: Release build
        run: cargo build --release

      - name: CLI save and resume smoke test
        shell: bash
        run: |
          SAVE_DIR="$RUNNER_TEMP/tks-smoke"
          printf 'new guanyu 777\nchoose 1\nend\nquit\n' | cargo run --quiet -- --plain --save-dir "$SAVE_DIR" > "$RUNNER_TEMP/tks-first.log"
          printf 'status\npowers\nevents\nmetrics\npiles\ntheme light\nquit\n' | cargo run --quiet -- --plain --save-dir "$SAVE_DIR" > "$RUNNER_TEMP/tks-second.log"
          python3 - <<'PY'
          import json, os, pathlib
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-smoke'
          game = json.loads((directory / 'save.json').read_text())
          prefs = json.loads((directory / 'settings.json').read_text())
          profile = json.loads((directory / 'chronicle.json').read_text())
          assert game['version'] == 2 and game['revision'] == 2
          assert game['stage'] == 'combat' and game['floor'] == 1
          assert len(game['battle']['hand']) > 0 and game['rng_state']
          assert game['battle']['event_seq'] >= 2
          assert len(game['battle']['events']) > 0
          assert all(a['seq'] < b['seq'] for a, b in zip(game['battle']['events'],game['battle']['events'][1:]))
          assert prefs['theme'] == 'light'
          assert profile['version'] == 1 and profile['started'] == 1
          assert profile['best_floor'] >= 1
          assert '读取进度成功' in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-second.log').read_text()
          assert '结算' in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-second.log').read_text()
          assert '抽牌堆' in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-second.log').read_text()
          assert '亲兵：行动' in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-second.log').read_text()
          assert game['telemetry']['totals']['battles_started']==1
          print('CLI mid-combat save/theme/resume smoke test passed')
          PY

      - name: CLI selected attack tutoring end-to-end
        shell: bash
        run: |
          SAVEDIR="$RUNNER_TEMP/tks-select"
          printf 'new zhuge 8301\nchoose 1\nquit\n' | cargo run --quiet -- --plain --save-dir "$SAVEDIR" > "$RUNNER_TEMP/tks-setup.log"
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-select' / 'save.json'
          game = json.loads(path.read_text())
          def card(id):
              return {'id':id, 'upgraded':False,'enchantment':None,'quest_progress':0,'temporary':False}
          game['battle']['hand'] = [card('xingpan_tutor')]
          game['battle']['draw'] = [card('defend'), card('strike'), card('qinglong')]
          game['battle']['discard'] = []
          game['battle']['energy'] = 3
          path.write_text(json.dumps(game,ensure_ascii=False))
          PY
          printf 'piles\nplay 1 1 2\nquit\n' | cargo run --quiet -- --plain --save-dir "$SAVEDIR" > "$RUNNER_TEMP/tks-selected.log"
          python3 - <<'PY'
          import json,os,pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'tks-select'/'save.json'
          game=json.loads(path.read_text())
          battle=game['battle']
          assert game['revision']==2, game['revision']
          assert any(c['id']=='strike' for c in battle['hand'])
          assert [c['id'] for c in battle['draw']]==['defend','qinglong']
          assert any(e['kind']=='card_tutored' and e['source']=='strike' for e in battle['events'])
          assert '抽牌堆' in (pathlib.Path(os.environ['RUNNER_TEMP'])/'tks-selected.log').read_text()
          print('CLI selected-pile tutor integration passed')
          PY

      - name: CLI doctrine selection persists across process restarts
        shell: bash
        run: |
          SAVEDIR="$RUNNER_TEMP/tks-doctrine"
          printf 'new sun 8391\ndoctrine\ndoctrine sun_discard\nquit\n' | cargo run --quiet -- --plain --save-dir "$SAVEDIR" > "$RUNNER_TEMP/tks-doctrine-first.log"
          python3 - <<'PY'
          import pathlib,json,os
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'tks-doctrine'/'save.json'
          g=json.loads(p.read_text())
          assert g['hero']=='sun_shangxiang'
          assert g['doctrine']=='sun_discard'
          assert len(g['deck'])==10
          print('CLI doctrine preference persisted without changing the starter deck')
          PY
          printf 'doctrine\nquit\n' | cargo run --quiet -- --plain --save-dir "$SAVEDIR" > "$RUNNER_TEMP/tks-doctrine-second.log"
          python3 - <<'PY'
          import pathlib,os
          s=(pathlib.Path(os.environ['RUNNER_TEMP'])/'tks-doctrine-second.log').read_text()
          assert '飞羽换阵' in s
          print('CLI doctrine reload and display confirmed')
          PY

      - name: Seeded autoplay and snapshot stability (1000 runs)
        run: cargo run --release --bin tks-sim -- 1000
      - name: Paired balance report by hero and ascension
        run: cargo run --release --bin tks-sim -- --balance 20 "$RUNNER_TEMP/tks-balance.json"

      - name: Validate balance report structure
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"tks-balance.json"
          report=json.loads(path.read_text())
          assert report["schema_version"] == 1
          assert report["samples_per_cell"] == 20
          assert len(report["cells"]) == 55
          assert all("tactical_telemetry" in x and "baseline_telemetry" in x
                     for x in report["cells"])
          assert all(x["tactical_telemetry"]["turns_completed"] >= 0 for x in report["cells"])
          assert sum(x["tactical_telemetry"]["troop_attacks"] for x in report["cells"]
                     if x["hero"]=="曹操") > 0
          assert sum(x["tactical_telemetry"]["sun_combo_procs"] for x in report["cells"]
                     if x["hero"]=="孙尚香") > 0
          assert sum(x["samples"] for x in report["cells"]) == 1100
          assert len(set((x["hero"],x["ascension"]) for x in report["cells"])) == 55
          assert all(0 <= x["baseline_wins"] <= 20 and
                     0 <= x["tactical_wins"] <= 20 and
                     0 <= x["baseline_boss_deaths"] <= 20 and
                     0 <= x["tactical_boss_deaths"] <= 20
                     for x in report["cells"])
          assert sum(x["deaths"] for x in report["baseline_death_encounters"]) == 1100 - sum(x["baseline_wins"] for x in report["cells"])
          assert sum(x["deaths"] for x in report["tactical_death_encounters"]) == 1100 - sum(x["tactical_wins"] for x in report["cells"])
          print("Verified deterministic 55-cell paired balance sample, no invented rates")
          PY
      - name: Sun Shangxiang equal-deck-size archetype study
        run: cargo run --release --bin tks-sim -- --sun-archetypes 15 "$RUNNER_TEMP/tks-sun.json"

      - name: Verify Sun package study integrity
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          doc=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"tks-sun.json").read_text())
          assert doc["schema_version"]==1
          assert doc["samples_per_cell"]==15
          assert len(doc["cells"])==33
          assert set(x["package"] for x in doc["cells"])=={"standard","discard","combo"}
          assert all(x["samples"]==15 and 0<=x["wins"]<=15 for x in doc["cells"])
          assert len(set((x["package"],x["ascension"]) for x in doc["cells"]))==33
          assert sum(x["samples"] for x in doc["cells"])==495
          print("Sun archetype fixtures tested on 495 independent deterministic runs")
          PY

      - name: Natural Sun doctrine drafting study (495 runs)
        run: cargo run --release --bin tks-sim -- --natural-drafting 15 "$RUNNER_TEMP/tks-natural.json"

      - name: Validate normal starter builds and focus offer accounting
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          doc=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'tks-natural.json').read_text())
          assert doc['schema_version']==1
          assert doc['samples_per_cell']==15
          assert len(doc['cells'])==33
          assert set(c['policy'] for c in doc['cells'])=={
              'unfocused_tactical','choose_discard','choose_combo'}
          assert len(set((c['policy'],c['ascension']) for c in doc['cells']))==33
          assert sum(c['samples'] for c in doc['cells'])==495
          assert all(0<=c['wins']<=15 and 0<=c['discard_formed']<=15
                     and 0<=c['combo_formed']<=15 and
                     0<=c['focus_picks']<=c['focus_offer_screens']<=c['reward_screens']
                     for c in doc['cells'])
          print('Normal starter, 33 stratified policies and honest offer/take accounting verified')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: tks-balance-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/tks-balance.json
            ${{ runner.temp }}/tks-sun.json
            ${{ runner.temp }}/tks-natural.json
          retention-days: 30


  compare-balance:
    name: Verify portable deterministic balance
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tks-balance-*
          path: balance
      - name: Compare macOS and Linux paired sample byte-for-byte
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base=Path('balance')
          linux=base/'tks-balance-ubuntu-latest'/'tks-balance.json'
          mac=base/'tks-balance-macos-14'/'tks-balance.json'
          assert linux.exists() and mac.exists(),(linux,mac)
          assert linux.read_bytes()==mac.read_bytes(), 'OS-specific RNG or rules divergence in balance report'
          sun_linux=base/'tks-balance-ubuntu-latest'/'tks-sun.json'
          sun_mac=base/'tks-balance-macos-14'/'tks-sun.json'
          assert sun_linux.exists() and sun_mac.exists()
          assert sun_linux.read_bytes()==sun_mac.read_bytes(), 'OS-specific Sun archetype divergence'
          natural_linux=base/'tks-balance-ubuntu-latest'/'tks-natural.json'
          natural_mac=base/'tks-balance-macos-14'/'tks-natural.json'
          assert natural_linux.exists() and natural_mac.exists()
          assert natural_linux.read_bytes()==natural_mac.read_bytes(), 'OS-specific natural drafting divergence'
          print('All three paired balance, curated archetype and normal draft reports match across OS')
          PY
