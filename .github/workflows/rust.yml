name: Rust checks
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all-targets
      - name: Gherkin BDD acceptance
        run: cargo test --test bdd -- --nocapture
      - name: Release build
        run: cargo build --release

      - name: CLI save and resume smoke test
        shell: bash
        run: |
          SAVE_DIR="$RUNNER_TEMP/tks-smoke"
          printf 'new guanyu 777\nchoose 1\nend\nquit\n' | cargo run --quiet -- --plain --save-dir "$SAVE_DIR" > "$RUNNER_TEMP/tks-first.log"
          printf 'status\npowers\nevents\npiles\ntheme light\nquit\n' | cargo run --quiet -- --plain --save-dir "$SAVE_DIR" > "$RUNNER_TEMP/tks-second.log"
          python3 - <<'PY'
          import json, os, pathlib
          directory = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-smoke'
          game = json.loads((directory / 'save.json').read_text())
          prefs = json.loads((directory / 'settings.json').read_text())
          profile = json.loads((directory / 'chronicle.json').read_text())
          assert game['version'] == 2 and game['revision'] == 2
          assert game['stage'] == 'combat' and game['floor'] == 1
          assert len(game['battle']['hand']) > 0 and game['rng_state']
          assert game['battle']['event_seq'] >= 2
          assert len(game['battle']['events']) > 0
          assert all(a['seq'] < b['seq'] for a, b in zip(game['battle']['events'],game['battle']['events'][1:]))
          assert prefs['theme'] == 'light'
          assert profile['version'] == 1 and profile['started'] == 1
          assert profile['best_floor'] >= 1
          assert '读取进度成功' in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-second.log').read_text()
          assert '结算' in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-second.log').read_text()
          assert '抽牌堆' in (pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-second.log').read_text()
          print('CLI mid-combat save/theme/resume smoke test passed')
          PY

      - name: CLI selected attack tutoring end-to-end
        shell: bash
        run: |
          SAVEDIR="$RUNNER_TEMP/tks-select"
          printf 'new zhuge 8301\nchoose 1\nquit\n' | cargo run --quiet -- --plain --save-dir "$SAVEDIR" > "$RUNNER_TEMP/tks-setup.log"
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'tks-select' / 'save.json'
          game = json.loads(path.read_text())
          def card(id):
              return {'id':id, 'upgraded':False,'enchantment':None,'quest_progress':0,'temporary':False}
          game['battle']['hand'] = [card('xingpan_tutor')]
          game['battle']['draw'] = [card('defend'), card('strike'), card('qinglong')]
          game['battle']['discard'] = []
          game['battle']['energy'] = 3
          path.write_text(json.dumps(game,ensure_ascii=False))
          PY
          printf 'piles\nplay 1 1 2\nquit\n' | cargo run --quiet -- --plain --save-dir "$SAVEDIR" > "$RUNNER_TEMP/tks-selected.log"
          python3 - <<'PY'
          import json,os,pathlib
          path = pathlib.Path(os.environ['RUNNER_TEMP'])/'tks-select'/'save.json'
          game=json.loads(path.read_text())
          battle=game['battle']
          assert game['revision']==2, game['revision']
          assert any(c['id']=='strike' for c in battle['hand'])
          assert [c['id'] for c in battle['draw']]==['defend','qinglong']
          assert any(e['kind']=='card_tutored' and e['source']=='strike' for e in battle['events'])
          assert '抽牌堆' in (pathlib.Path(os.environ['RUNNER_TEMP'])/'tks-selected.log').read_text()
          print('CLI selected-pile tutor integration passed')
          PY

      - name: Seeded autoplay and snapshot stability (1000 runs)
        run: cargo run --release --bin tks-sim -- 1000
      - name: Paired balance report by hero and ascension
        run: cargo run --release --bin tks-sim -- --balance 20 "$RUNNER_TEMP/tks-balance.json"

      - name: Validate balance report structure
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,pathlib
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"tks-balance.json"
          report=json.loads(path.read_text())
          assert report["schema_version"] == 1
          assert report["samples_per_cell"] == 20
          assert len(report["cells"]) == 55
          assert sum(x["samples"] for x in report["cells"]) == 1100
          assert len(set((x["hero"],x["ascension"]) for x in report["cells"])) == 55
          assert all(0 <= x["baseline_wins"] <= 20 and
                     0 <= x["tactical_wins"] <= 20 and
                     0 <= x["baseline_boss_deaths"] <= 20 and
                     0 <= x["tactical_boss_deaths"] <= 20
                     for x in report["cells"])
          assert sum(x["deaths"] for x in report["baseline_death_encounters"]) == 1100 - sum(x["baseline_wins"] for x in report["cells"])
          assert sum(x["deaths"] for x in report["tactical_death_encounters"]) == 1100 - sum(x["tactical_wins"] for x in report["cells"])
          print("Verified deterministic 55-cell paired balance sample, no invented rates")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tks-balance-${{ matrix.os }}
          path: ${{ runner.temp }}/tks-balance.json
          retention-days: 30

