[package]
name = "three-kingdoms-spire-reborn"
default-run = "tks"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "An original Three Kingdoms deckbuilding roguelike with a portable Rust rules engine"
license = "MIT"

[lib]
name = "three_kingdoms_spire_reborn"
path = "src/lib.rs"

[[bin]]
name = "tks"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
